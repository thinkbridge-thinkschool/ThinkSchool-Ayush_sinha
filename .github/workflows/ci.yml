name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Docker is preinstalled and running on GitHub-hosted ubuntu-latest
      # runners, so Testcontainers.MsSql can start its own SQL Server
      # container below with no extra setup and no manually-created
      # SQL Server service.

      - name: Restore Tests.Domain
        run: dotnet restore day-1/QuotesApi/Tests.Domain/Tests.Domain.csproj

      - name: Restore Tests.Integration
        run: dotnet restore day-1/QuotesApi/Tests.Integration/Tests.Integration.csproj

      - name: Build Tests.Domain
        run: dotnet build day-1/QuotesApi/Tests.Domain/Tests.Domain.csproj --no-restore

      - name: Build Tests.Integration
        run: dotnet build day-1/QuotesApi/Tests.Integration/Tests.Integration.csproj --no-restore

      - name: Run unit tests (Tests.Domain)
        run: >
          dotnet test day-1/QuotesApi/Tests.Domain/Tests.Domain.csproj
          --no-build
          --logger "trx;LogFileName=Tests.Domain.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/Domain

      - name: Run integration tests (Tests.Integration)
        run: >
          dotnet test day-1/QuotesApi/Tests.Integration/Tests.Integration.csproj
          --no-build
          --logger "trx;LogFileName=Tests.Integration.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/Integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: TestResults/**/coverage.cobertura.xml

      - name: Enforce total line coverage >= 70%
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import posixpath
          import sys
          import xml.etree.ElementTree as ET

          THRESHOLD = 70.0
          reports = sorted(glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True))
          if not reports:
              sys.exit("No coverage.cobertura.xml files found under TestResults/")

          valid_lines = set()
          covered_lines = set()

          def normalize_source(filename, source_roots):
              filename = filename.replace("\\\\", "/")
              candidates = [filename]
              if not posixpath.isabs(filename):
                  candidates.extend(
                      posixpath.join(root.replace("\\\\", "/"), filename)
                      for root in source_roots
                  )
              path = posixpath.normpath(candidates[-1])
              # Cobertura reports can use different absolute checkout roots.
              # Keep the repository-relative portion when it is available.
              marker = "day-1/QuotesApi/"
              if marker in path:
                  path = marker + path.split(marker, 1)[1]
              return path

          for report in reports:
              root = ET.parse(report).getroot()
              source_roots = [source.text or "" for source in root.findall("./sources/source")]
              report_valid = set()
              report_covered = set()

              for class_element in root.findall(".//class"):
                  filename = class_element.get("filename")
                  if not filename:
                      continue
                  source = normalize_source(filename, source_roots)
                  for line in class_element.findall("./lines/line"):
                      number = line.get("number")
                      if number is None:
                          continue
                      key = f"{source}:{number}"
                      report_valid.add(key)
                      if int(line.get("hits", "0")) > 0:
                          report_covered.add(key)

              print(f"Coverage report: {report}")
              print(f"  covered: {len(report_covered)}")
              print(f"  valid: {len(report_valid)}")
              valid_lines.update(report_valid)
              covered_lines.update(report_covered)

          if not valid_lines:
              sys.exit("No coverable lines found; cannot compute coverage.")

          percentage = len(covered_lines) / len(valid_lines) * 100
          print(f"Unique covered lines: {len(covered_lines)}")
          print(f"Unique valid lines: {len(valid_lines)}")
          print(f"Total line coverage: {percentage:.2f}%")
          print(f"Required threshold: {THRESHOLD:.0f}%")
          if percentage < THRESHOLD:
              sys.exit(1)
          PY
